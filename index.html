<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Clicker+Script&display=swap" rel="stylesheet">
<title>Jogo de Vestir</title>

<style>
/* ======================== */
/* TELA INICIAL */
/* ======================== */
.start-screen {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: linear-gradient(180deg, #f9e6ff, #e0c3fc);
  display: flex; flex-direction: column;
  justify-content: center; align-items: center;
  text-align: center;
  z-index: 999;
  overflow: hidden;
}

#hearts-start {
  position: absolute;
  inset: 0;
  overflow: hidden;
  z-index: 0;
  pointer-events: none;
}

.start-screen > * {
  position: relative;
  z-index: 2;
}
/* Mantendo título centralizado */

.titulo-inicio {
  font-family: 'Clicker Script', cursive;
  font-size: 7rem;
  color: #b272eeff;
  margin-bottom: 20px;
  animation: pulsarSimples 2s ease-in-out infinite;
  text-align: center;
  position: relative; /* necessário para referência */
}

.icone-titulo {
  position: absolute;
  left: -420px;   /* distância da esquerda da tela, ajuste */
  top: 50%;     /* altura central da tela */
  transform: translateY(-150%); /* mantém verticalmente central */
  width: 150px;
  height: auto;
  z-index: 2;
  animation: pulsarFix 2s ease-in-out infinite;
}

@keyframes pulsarFix {
  0%   { transform: translateY(-50%) scale(1); }
  50%  { transform: translateY(-50%) scale(1.05); }
  100% { transform: translateY(-50%) scale(1); }
}

@keyframes pulsarSimples {
  0% { transform: scale(1); }
  50% { transform: scale(1.05); }
  100% { transform: scale(1); }
}


.creditos {
  font-size: 1.3rem;
  color: #555;
  margin-bottom: 40px;
}

.btn-start {
  padding: 18px 35px;
  font-size: 1.7rem;
  font-family: 'Clicker Script', cursive;
  background: linear-gradient(135deg, #a78bfa, #8b5cf6);
  color: #fff;
  border: none;
  border-radius: 16px;
  cursor: pointer;
  transition: 0.3s;
  box-shadow: 0 4px 8px rgba(139, 92, 246, 0.4);
}
.btn-start:hover {
  transform: scale(1.08);
  box-shadow: 0 6px 12px rgba(139, 92, 246, 0.5);
}

/* ======================== */
/* GAME BODY */
/* ======================== */
body {
  font-family: "Poppins", Arial, sans-serif;
  background: linear-gradient(180deg, #f9e6ff, #e0c3fc);
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  color: #333;
  overflow: hidden;
}

.container {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 60px;
  max-width: 1400px;
  width: 100%;
  height: 90vh;
  padding: 0 20px;
  box-sizing: border-box;
  position: relative;
}

/* PERSONAGEM */
.game-area {
  position: relative;
  width: 600px;
  height: 800px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.game-area img {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 100%;
  height: auto;
  object-fit: contain;
}

#pele { z-index: 1; }
#rostos { z-index: 2; }
#cabelo { z-index: 3; }
#roupa { z-index: 4; }

/* MENU LATERAL */
.menu {
  z-index: 10;
  display: flex;
  flex-direction: column;
  gap: 18px;
  background: rgba(255, 255, 255, 0.9);
  border-radius: 20px;
  padding: 20px 40px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
  width: 500px;
  height: 90vh;
  overflow-y: auto;
  box-sizing: border-box;
}

.menu::-webkit-scrollbar {
  width: 8px;
}
.menu::-webkit-scrollbar-thumb {
  background: #b48ef7;
  border-radius: 8px;
}

/* TITULOS */
h1 {
  font-family: 'Clicker Script', cursive;
  text-align: center;
  margin-bottom: 5px;
  font-size: 2.8rem;
  color: #9d11fa;
}

.section h2 {
  font-family: 'Clicker Script', cursive;
  font-size: 1.8rem;
  text-align: center;
  color: #444;
}

/* BOTÕES */
.buttons {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 12px;
}

.buttons button {
  flex: 1 1 45%;
  max-width: 45%;
  padding: 10px 0;
  background: linear-gradient(135deg, #a78bfa, #8b5cf6);
  color: white;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  font-size: 13px;
  box-shadow: 0 4px 8px rgba(139, 92, 246, 0.4);
}

.buttons button:hover {
  transform: scale(1.05);
  background: linear-gradient(135deg, #8b5cf6, #c4b5fd);
}

/* BOTÕES LATERAIS */
.side-buttons {
  position: fixed;
  left: 25px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 10px;
  z-index: 20;
}

.side-buttons button {
  padding: 10px 18px;
  background: linear-gradient(135deg, #a78bfa, #8b5cf6);
  border-radius: 10px;
  color: white;
  border: none;
  cursor: pointer;
  font-size: 20px;
  box-shadow: 0 4px 10px rgba(139, 92, 246, 0.4);
}

/* ========================= */
/* CORAÇÕES */
/* ========================= */
.heart {
  position: absolute;
  bottom: -20px;
  color: #a748ffff;
  font-size: 20px;
  z-index: 0;
  animation: subir 8s linear infinite;
}

@keyframes subir {
  0% { transform: translateY(0) scale(1); opacity: 1; }
  100% { transform: translateY(-110vh) scale(1.5); opacity: 0; }
}

/* ========================= */
/* RESPONSIVIDADE */
/* ========================= */

/* ----- Até 1300px ----- */
@media (max-width: 1300px) {
  .container {
    gap: 20px;
  }
  .game-area {
    width: 480px;
    height: 700px;
  }
  .menu {
    width: 420px;
  }
}

/* ----- Até 1150px ----- */
@media (max-width: 1150px) {
  body {
    overflow-y: auto;
  }
  .container {
    flex-direction: column;
    height: auto;
    padding-bottom: 40px;
  }
  .side-buttons {
    top: 20px;
    left: 20px;
    transform: none;
    flex-direction: row;
  }
  .game-area {
    width: 400px;
    height: 600px;
  }
  .menu {
    width: 90%;
    height: auto;
  }
}

/* ----- Até 850px (tablet em pé) ----- */
@media (max-width: 850px) {
  .game-area {
    width: 320px;
    height: 500px;
  }
  .buttons button {
    flex: 1 1 100%;
    max-width: 100%;
  }
}
</style>
</head>

<body>
  <!-- =============== TELA INICIAL =============== -->
  <div id="tela-inicial" class="start-screen">
       <h1 class="titulo-inicio">Jogo de Vestir</h1>
    <div id="hearts-start"></div>

    <!-- IMAGEM + TÍTULO JUNTOS -->
    <div class="titulo-wrapper">
      <img src="imagens/eu.png" class="icone-titulo">
   
    </div>

    <p class="creditos">Desenvolvido por Ana Luiza Stábile</p>
    <button id="btnStart" class="btn-start">Iniciar Jogo</button>
    <button id="btnSobre" class="btn-start" style="margin-top: 15px;">Sobre</button>
  </div>

  <!-- =============== JOGO =============== -->
  <div class="container" id="game-container" style="display:none;">
    <div class="game-area" aria-hidden="false">
      <img id="pele" src="imagens/pele1.png">
      <img id="rostos" src="" >
      <img id="cabelo" src="">
      <img id="roupa" src="" >
    </div>

    <div id="hearts-game" aria-hidden="true"></div>

    <div class="side-buttons" aria-hidden="false">
      <button id="btnLimpar">Limpar</button>
      <button id="btnPronto">Pronto</button>
      <button id="btnVoltar">Voltar</button>
    </div>

    <div class="menu" role="region" aria-label="Menu de opções">
      <h1 id="tituloTema">Vista-se para ...</h1>
      <!-- ... todo o resto do menu permanece igual ... -->
      <!-- Pele -->
      <div class="section">
        <h2>Pele</h2>
        <div class="buttons">
          <button onclick="mudarPele('imagens/pele1.png')">Pele 1</button>
          <button onclick="mudarPele('imagens/pele2.png')">Pele 2</button>
          <button onclick="mudarPele('imagens/pele3.png')">Pele 3</button>
          <button onclick="mudarPele('imagens/pele4.png')">Pele 4</button>
        </div>
      </div>
      <!-- Cabelo -->
      <div class="section">
        <h2>Cabelos</h2>
        <div class="buttons">
          <button onclick="mudarCabelo('imagens/cabeloPreto.png')">Preto</button>
          <button onclick="mudarCabelo('imagens/cabeloRuivo.png')">Ruivo</button>
          <button onclick="mudarCabelo('imagens/cabeloLoiro.png')">Loiro</button>
          <button onclick="mudarCabelo('imagens/cabeloRosa.png')">Rosa</button>
          <button onclick="mudarCabelo('imagens/cabeloCacheado.png')">Cacheado</button>
          <button onclick="mudarCabelo('imagens/cabeloCastanho.png')">Castanho</button>
        </div>
      </div>
      <!-- Roupa -->
      <div class="section">
        <h2>Roupas</h2>
        <div class="buttons">
          <button onclick="mudarRoupa('imagens/vestido.png')">Vestido Rosa</button>
          <button onclick="mudarRoupa('imagens/uniforme.png')">Uniforme</button>
          <button onclick="mudarRoupa('imagens/macaquinho.png')">Jardineira</button>
          <button onclick="mudarRoupa('imagens/vestidoAzul.png')">Vestido Azul</button>
          <button onclick="mudarRoupa('imagens/roupaVermelha.png')">Vermelha</button>
          <button onclick="mudarRoupa('imagens/roupaAmarela.png')">Amarela</button>
        </div>
      </div>
      <!-- Rostos -->
      <div class="section">
        <h2>Rostos</h2>
        <div class="buttons">
          <button onclick="mudarRostos('imagens/olhoAzul.png')">Olhos Azuis</button>
          <button onclick="mudarRostos('imagens/olhoVerde.png')">Olhos Verdes</button>
          <button onclick="mudarRostos('imagens/olhoPreto.png')">Olhos Pretos</button>
          <button onclick="mudarRostos('imagens/olhoRosa.png')">Olhos Rosa</button>
        </div>
      </div>
    </div>
  </div>


<script>
document.addEventListener('DOMContentLoaded', () => {

  const btnStart = document.getElementById('btnStart');
  const btnSobre = document.getElementById('btnSobre');
  const telaInicial = document.getElementById('tela-inicial');
  const gameContainer = document.getElementById('game-container');
  const heartsStartContainer = document.getElementById('hearts-start');
  const heartsGameContainer = document.getElementById('hearts-game');

  let intervaloInicio = setInterval(() => criarCoracaoParaContainer(heartsStartContainer), 400);
  let intervaloJogo = null;

  // Funções de mudança de imagem (exportadas pra ficar igual ao seu original)
  window.mudarPele = img => document.getElementById("pele").src = img;
  window.mudarCabelo = img => document.getElementById("cabelo").src = img;
  window.mudarRoupa = img => document.getElementById("roupa").src = img;
  window.mudarRostos = img => document.getElementById("rostos").src = img;

  // Adiciona efeito neon aos botões (mantive o seu script original)
  const botoes = document.querySelectorAll('.buttons button');
  botoes.forEach(btn => {
    btn.addEventListener('click', () => {
      btn.classList.add('neon-click');
      setTimeout(() => btn.classList.remove('neon-click'), 600);
    });
  });

  // ================== BOTÃO INICIAR ==================
 btnStart.addEventListener('click', () => {
  // Resetar personagens sempre que o jogo iniciar
  mudarPele('imagens/pele1.png');
  mudarCabelo('');
  mudarRoupa('');
  mudarRostos('');

  clearInterval(intervaloInicio);
  telaInicial.style.display = "none";
  gameContainer.style.display = "flex";
  mostrarOcasionPopUp();

  intervaloJogo = setInterval(() => criarCoracaoParaContainer(heartsGameContainer), 400);
});

  // ================== BOTÃO SOBRE ==================
  btnSobre.addEventListener('click', () => {
    const bg = document.createElement('div');
    bg.style.position = 'fixed';
    bg.style.top = 0;
    bg.style.left = 0;
    bg.style.width = '100vw';
    bg.style.height = '100vh';
    bg.style.background = 'rgba(0,0,0,0.5)';
    bg.style.display = 'flex';
    bg.style.alignItems = 'center';
    bg.style.justifyContent = 'center';
    bg.style.zIndex = 10000;

    const box = document.createElement('div');
    box.style.background = 'white';
    box.style.padding = '18px 22px';
    box.style.borderRadius = '12px';
    box.style.textAlign = 'center';
    box.style.fontSize = '15px';
    box.style.maxWidth = '400px';

    const texto = document.createElement('p');
    texto.innerText = "'Jogo de Vestir' é um jogo de moda desenvolvido e ilustrado por Ana Luiza Stábile, aluna do 2º ano do Ensino Médio. O jogo busca, de forma divertida e criativa, sortear uma ocasião aleatória em que o jogador explore todo o seu senso de estilo!";
    texto.style.marginBottom = '16px';

    const botao = document.createElement('button');
    botao.innerText = 'Fechar';
    botao.style.padding = '10px 20px';
    botao.style.background = 'linear-gradient(135deg, #a78bfa, #8b5cf6)';
    botao.style.color = 'white';
    botao.style.border = 'none';
    botao.style.borderRadius = '10px';
    botao.style.cursor = 'pointer';
    botao.onclick = () => bg.remove();

    box.appendChild(texto);
    box.appendChild(botao);
    bg.appendChild(box);
    document.body.appendChild(bg);
  });

  // ================== BOTÕES DO JOGO ==================
  document.getElementById('btnLimpar').onclick = () => {
    mudarPele('imagens/pele1.png');
    mudarCabelo('');
    mudarRoupa('');
    mudarRostos('');
  };
  document.getElementById('btnVoltar').onclick = () => {
    gameContainer.style.display = "none";
    telaInicial.style.display = "flex";
    clearInterval(intervaloJogo);
    heartsGameContainer.innerHTML = '';
    intervaloInicio = setInterval(() => criarCoracaoParaContainer(heartsStartContainer), 400);
  };
document.getElementById("btnPronto").addEventListener("click", () => {

  // Salvar imagens atuais no localStorage
  localStorage.setItem("peleSelecionada", document.getElementById("pele").src);
  localStorage.setItem("cabeloSelecionado", document.getElementById("cabelo").src);
  localStorage.setItem("roupaSelecionada", document.getElementById("roupa").src);
  localStorage.setItem("rostosSelecionados", document.getElementById("rostos").src);

  // Ir para a segunda tela
  window.location.href = "final.html";
});

  // ================== FUNÇÕES DE CORAÇÕES ==================
  function criarCoracaoParaContainer(container) {
    const heart = document.createElement('div');
    heart.classList.add('heart');
    heart.textContent = '♡';
    // coloca dentro do container levando em conta sua largura (não usar vw direto quando estiver dentro do container)
    const leftPerc = Math.random() * 90; // evita sair muito das laterais
    heart.style.left = leftPerc + '%';
    heart.style.fontSize = (10 + Math.random() * 24) + 'px';
    heart.style.animationDuration = (4 + Math.random() * 5) + 's';
    container.appendChild(heart);
    setTimeout(() => heart.remove(), 6000);
  }

  // ================== FUNÇÃO POPUP OCASIÃO ==================
  const ocasioes = ["encontro romântico","jantar elegante","piquenique","escola","acampamento","circo", "parque", "shopping"];
  function mostrarOcasionPopUp() {
    soltarConfetes();
    const tema = ocasioes[Math.floor(Math.random() * ocasioes.length)];
    document.getElementById("tituloTema").textContent = "Vista-se para... " + tema + "!";
    const bg = document.createElement("div");
    bg.style.position = "fixed";
    bg.style.top = 0;
    bg.style.left = 0;
    bg.style.width = "100vw";
    bg.style.height = "100vh";
    bg.style.background = "rgba(0,0,0,0.5)";
    bg.style.display = "flex";
    bg.style.alignItems = "center";
    bg.style.justifyContent = "center";
    bg.style.zIndex = "9999";

    const box = document.createElement("div");
    box.style.background = "white";
    box.style.padding = "20px 26px";
    box.style.borderRadius = "12px";
    box.style.textAlign = "center";
    box.style.fontSize = "18px";

    const texto = document.createElement("p");
    texto.innerText = "Ocasião sorteada: " + tema;
    texto.style.marginBottom = "14px";
    texto.style.fontWeight = "bold";

    const botao = document.createElement("button");
    botao.innerText = "OK";
    botao.style.padding = "10px 18px";
    botao.style.background = 'linear-gradient(135deg, #a78bfa, #8b5cf6)';
    botao.style.color = "white";
    botao.style.border = "none";
    botao.style.borderRadius = "12px";
    botao.style.cursor = "pointer";
    botao.style.fontSize = "16px";
    botao.onclick = () => bg.remove();

    box.appendChild(texto);
    box.appendChild(botao);
    bg.appendChild(box);
    document.body.appendChild(bg);
  }

  // ================== CONFETES ==================
 function soltarConfetes() {
  const total = 40;
  for (let i = 0; i < total; i++) {
    const confete = document.createElement("div");
    confete.innerHTML = "★";                // símbolo novo
    confete.style.color = "#FFD700";        // amarelo ouro

    confete.style.position = "fixed";
    confete.style.top = "-20px";
    confete.style.left = Math.random() * 100 + "vw";
    confete.style.fontSize = (20 + Math.random() * 20) + "px";
    confete.style.opacity = "0.9";
    confete.style.zIndex = "99999";

    const dur = 1500 + Math.random() * 500;
    confete.style.transition = `transform ${dur}ms linear`;

    document.body.appendChild(confete);

    setTimeout(() => {
      confete.style.transform = `translateY(${110}vh) rotate(${Math.random() * 360}deg)`;
    }, 30);

    setTimeout(() => confete.remove(), dur + 300);
  }
}
});
</script>
</body>
</html>
